name: Accolade
description: >-
  Accolade is a personalized healthcare and benefits navigation platform for
  employers and health plans. It pairs members with a care team of advocates,
  registered nurses, physicians, and mental-health specialists to help them
  understand their benefits, find in-network care, book appointments, and manage
  chronic and complex conditions. Accolade combines this human advocacy with
  virtual primary care, expert medical opinion, and mental-health services
  delivered through its member web and mobile apps. The company was surfaced as
  a portfolio company of a16z and added to the API Evangelist network. Accolade
  is a member-facing benefits platform and does not publish a public API,
  developer portal, or developer documentation.
